version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-campus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: smart_campus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    command: |
      bash -c "sleep 5 && psql -h postgres -U postgres -c \"CREATE EXTENSION IF NOT EXISTS \\\"uuid-ossp\\\"; CREATE EXTENSION IF NOT EXISTS \\\"pgcrypto\\\";\""
    environment:
      PGPASSWORD: postgres123

volumes:
  postgres_data: